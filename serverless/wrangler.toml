name = "iot-career-hub-api"
main = "worker.js"
compatibility_date = "2024-09-01"

# KV 数据库(存岗位/统计/投稿/反馈)
[[kv_namespaces]]
binding = "IOT_HUB"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_KV_ID"

# 定时任务:每天 05:00 / 12:00(北京时间 = UTC 21:00 / 04:00)
[triggers]
crons = ["0 21 * * *", "0 4 * * *"]

# 路由:部署到自定义域名或 workers.dev 子域(无需额外配置)
